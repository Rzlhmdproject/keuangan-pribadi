<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#00529C" />
<title>BRImo Personal — Keuangan Saya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* ============================================================
   DESIGN SYSTEM — BRImo Style
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bri-blue:#00529C;
  --bri-blue-dark:#003A70;
  --bri-blue-light:#1B6CB8;
  --bri-orange:#F37021;
  --bri-orange-soft:#FFF4EC;
  --bg:#F5F7FA;
  --card:#FFFFFF;
  --text:#1A1A1A;
  --text-2:#6B7280;
  --text-3:#9CA3AF;
  --border:#E5E7EB;
  --green:#10B981;
  --red:#EF4444;
  --yellow:#F59E0B;
  --radius:12px;
  --radius-lg:16px;
  --shadow:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
  --shadow-md:0 4px 12px rgba(0,0,0,0.08);
}
html,body{height:100%}
body{
  font-family:'Inter',-apple-system,system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.5;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:16px !important} /* prevent iOS zoom */

/* ============================================================
   APP LAYOUT — Mobile-first, max-width di desktop
   ============================================================ */
.app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  background:var(--bg);
  position:relative;
  padding-bottom:80px;
  box-shadow:0 0 40px rgba(0,0,0,0.05);
}
@media(min-width:768px){
  body{background:#E8ECF2;padding:20px 0}
  .app{
    border-radius:24px;
    min-height:calc(100vh - 40px);
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,0.15);
  }
}

/* ============================================================
   HEADER (biru seperti BRImo)
   ============================================================ */
.header{
  background:linear-gradient(135deg,var(--bri-blue) 0%,var(--bri-blue-dark) 100%);
  color:#fff;
  padding:20px 20px 24px;
  position:relative;
  border-radius:0 0 24px 24px;
  margin-bottom:-20px;
  z-index:1;
}
@media(min-width:768px){
  .header{border-radius:0 0 24px 24px}
}
.header-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}
.header-brand{
  display:flex;
  align-items:center;
  gap:10px;
}
.header-logo{
  width:32px;
  height:32px;
  background:var(--bri-orange);
  border-radius:8px;
  display:grid;
  place-items:center;
  font-weight:800;
  font-size:16px;
  color:#fff;
}
.header-title{
  font-size:16px;
  font-weight:700;
  letter-spacing:-0.01em;
}
.header-actions{
  display:flex;
  gap:8px;
}
.header-icon-btn{
  width:36px;
  height:36px;
  border-radius:10px;
  background:rgba(255,255,255,0.15);
  border:none;
  color:#fff;
  cursor:pointer;
  display:grid;
  place-items:center;
  transition:background 0.2s;
}
.header-icon-btn:hover{background:rgba(255,255,255,0.25)}
.header-icon-btn:active{transform:scale(0.95)}

/* Saldo card */
.balance-label{
  font-size:12px;
  opacity:0.85;
  margin-bottom:4px;
  display:flex;
  align-items:center;
  gap:6px;
}
.balance-eye{
  background:none;
  border:none;
  color:#fff;
  opacity:0.85;
  cursor:pointer;
  padding:2px;
  display:grid;
  place-items:center;
}
.balance-amount{
  font-size:28px;
  font-weight:800;
  letter-spacing:-0.02em;
  font-variant-numeric:tabular-nums;
  margin-bottom:4px;
}
.balance-sub{
  font-size:12px;
  opacity:0.75;
}

/* ============================================================
   MENU GRID (seperti BRImo)
   ============================================================ */
.menu-card{
  background:var(--card);
  margin:20px 16px 0;
  padding:20px 16px;
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow);
  position:relative;
  z-index:2;
}
.menu-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}
.menu-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  background:none;
  border:none;
  cursor:pointer;
  padding:8px 4px;
  border-radius:12px;
  transition:background 0.2s;
}
.menu-item:hover{background:var(--bg)}
.menu-item:active{transform:scale(0.95)}
.menu-icon{
  width:48px;
  height:48px;
  border-radius:14px;
  display:grid;
  place-items:center;
  font-size:22px;
  background:var(--bri-orange-soft);
  color:var(--bri-orange);
}
.menu-icon.blue{background:#E6F0FA;color:var(--bri-blue)}
.menu-icon.green{background:#E7F8F1;color:var(--green)}
.menu-icon.red{background:#FEE9E9;color:var(--red)}
.menu-icon.yellow{background:#FFF7E6;color:var(--yellow)}
.menu-label{
  font-size:11px;
  font-weight:500;
  color:var(--text);
  text-align:center;
  line-height:1.3;
}

/* ============================================================
   SECTION
   ============================================================ */
.section{
  margin:20px 16px 0;
}
.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}
.section-title{
  font-size:15px;
  font-weight:700;
  color:var(--text);
}
.section-link{
  font-size:13px;
  color:var(--bri-blue);
  font-weight:600;
  background:none;
  border:none;
  cursor:pointer;
  padding:4px 0;
}

/* ============================================================
   TRANSACTION LIST
   ============================================================ */
.tx-list{
  background:var(--card);
  border-radius:var(--radius-lg);
  overflow:hidden;
  box-shadow:var(--shadow);
}
.tx-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 16px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
  transition:background 0.15s;
  background:var(--card);
  border:none;
  width:100%;
  text-align:left;
  font-family:inherit;
}
.tx-item:last-child{border-bottom:none}
.tx-item:active{background:var(--bg)}
.tx-icon{
  width:42px;
  height:42px;
  border-radius:12px;
  display:grid;
  place-items:center;
  font-size:20px;
  flex-shrink:0;
  background:var(--bri-orange-soft);
}
.tx-icon.income{background:#E7F8F1}
.tx-icon.expense{background:#FEE9E9}
.tx-icon.saving{background:#E6F0FA}
.tx-icon.debt{background:#FFF7E6}
.tx-info{flex:1;min-width:0}
.tx-cat{
  font-size:14px;
  font-weight:600;
  color:var(--text);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.tx-note{
  font-size:12px;
  color:var(--text-3);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-top:2px;
}
.tx-amount{
  font-size:14px;
  font-weight:700;
  text-align:right;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.tx-amount.income{color:var(--green)}
.tx-amount.expense{color:var(--red)}
.tx-amount.saving{color:var(--bri-blue)}
.tx-amount.debt{color:var(--yellow)}
.tx-date{
  font-size:11px;
  color:var(--text-3);
  text-align:right;
  margin-top:2px;
  font-variant-numeric:tabular-nums;
}

/* ============================================================
   BOTTOM NAV
   ============================================================ */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:480px;
  background:var(--card);
  border-top:1px solid var(--border);
  display:flex;
  justify-content:space-around;
  padding:8px 0 calc(8px + env(safe-area-inset-bottom));
  z-index:40;
  box-shadow:0 -2px 12px rgba(0,0,0,0.04);
}
@media(min-width:768px){
  .bottom-nav{
    border-radius:0 0 24px 24px;
    position:absolute;
    bottom:0;
  }
}
.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  background:none;
  border:none;
  cursor:pointer;
  padding:6px 12px;
  border-radius:8px;
  color:var(--text-3);
  font-size:10px;
  font-weight:500;
  font-family:inherit;
  transition:color 0.2s;
  flex:1;
  max-width:80px;
}
.nav-item.active{color:var(--bri-blue)}
.nav-item svg{width:22px;height:22px}

/* ============================================================
   PAGES
   ============================================================ */
.page{display:none}
.page.active{display:block;animation:fadeIn 0.25s}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.page-header{
  background:linear-gradient(135deg,var(--bri-blue) 0%,var(--bri-blue-dark) 100%);
  color:#fff;
  padding:20px;
  display:flex;
  align-items:center;
  gap:12px;
}
.page-header.back{
  padding:16px 20px;
}
.back-btn{
  width:36px;
  height:36px;
  border-radius:10px;
  background:rgba(255,255,255,0.15);
  border:none;
  color:#fff;
  cursor:pointer;
  display:grid;
  place-items:center;
}
.page-title-bar{
  font-size:16px;
  font-weight:700;
}

/* ============================================================
   CARD
   ============================================================ */
.card{
  background:var(--card);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow);
  overflow:hidden;
}

/* Stat cards */
.stat-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:16px;
}
.stat-box{
  background:var(--card);
  border-radius:var(--radius);
  padding:14px;
  box-shadow:var(--shadow);
}
.stat-label{
  font-size:11px;
  color:var(--text-2);
  font-weight:500;
  margin-bottom:4px;
}
.stat-value{
  font-size:16px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.stat-value.income{color:var(--green)}
.stat-value.expense{color:var(--red)}
.stat-value.saving{color:var(--bri-blue)}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:12px 20px;
  border-radius:10px;
  font-size:14px;
  font-weight:600;
  border:none;
  cursor:pointer;
  transition:all 0.15s;
  font-family:inherit;
  white-space:nowrap;
}
.btn:active{transform:scale(0.97)}
.btn-primary{
  background:var(--bri-blue);
  color:#fff;
}
.btn-primary:hover{background:var(--bri-blue-dark)}
.btn-orange{
  background:var(--bri-orange);
  color:#fff;
}
.btn-orange:hover{filter:brightness(0.95)}
.btn-ghost{
  background:var(--bg);
  color:var(--text);
  border:1px solid var(--border);
}
.btn-danger{
  background:#FEE9E9;
  color:var(--red);
}
.btn-block{width:100%}
.btn-sm{padding:8px 14px;font-size:13px}

/* ============================================================
   FORMS
   ============================================================ */
.form-group{margin-bottom:16px}
.form-label{
  display:block;
  font-size:12px;
  font-weight:600;
  color:var(--text-2);
  margin-bottom:6px;
}
.form-input{
  width:100%;
  background:var(--bg);
  border:1px solid var(--border);
  color:var(--text);
  padding:12px 14px;
  border-radius:10px;
  outline:none;
  transition:border-color 0.2s;
}
.form-input:focus{
  border-color:var(--bri-blue);
  background:#fff;
}
.form-input::placeholder{color:var(--text-3)}

/* Segmented */
.segmented{
  display:flex;
  background:var(--bg);
  border-radius:10px;
  padding:4px;
  gap:4px;
  margin-bottom:16px;
}
.seg-btn{
  flex:1;
  padding:10px;
  border:none;
  background:none;
  color:var(--text-2);
  border-radius:8px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  font-family:inherit;
  transition:all 0.2s;
}
.seg-btn.active{
  background:var(--bri-blue);
  color:#fff;
  box-shadow:0 2px 6px rgba(0,82,156,0.3);
}

/* ============================================================
   MODAL
   ============================================================ */
.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  z-index:100;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  animation:fadeIn 0.2s;
}
@media(min-width:768px){
  .modal-bg{align-items:center;padding:20px}
}
.modal{
  background:var(--card);
  width:100%;
  max-width:480px;
  border-radius:20px 20px 0 0;
  padding:24px 20px calc(24px + env(safe-area-inset-bottom));
  animation:slideUp 0.3s cubic-bezier(0.16,1,0.3,1);
  max-height:90vh;
  overflow-y:auto;
}
@media(min-width:768px){
  .modal{border-radius:20px}
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.modal-handle{
  width:40px;
  height:4px;
  background:var(--border);
  border-radius:2px;
  margin:0 auto 16px;
  display:block;
}
@media(min-width:768px){.modal-handle{display:none}}
.modal-title{
  font-size:18px;
  font-weight:700;
  margin-bottom:20px;
  text-align:center;
}

/* ============================================================
   EMPTY STATE
   ============================================================ */
.empty{
  padding:40px 20px;
  text-align:center;
}
.empty-icon{
  font-size:48px;
  margin-bottom:12px;
  opacity:0.5;
}
.empty-title{
  font-size:14px;
  font-weight:600;
  margin-bottom:4px;
}
.empty-desc{
  font-size:13px;
  color:var(--text-3);
  margin-bottom:16px;
}

/* ============================================================
   BUDGET
   ============================================================ */
.budget-item{
  padding:14px 16px;
  border-bottom:1px solid var(--border);
}
.budget-item:last-child{border-bottom:none}
.budget-head{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
  align-items:center;
}
.budget-name{font-size:13px;font-weight:600}
.budget-nums{font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}
.budget-bar{
  height:6px;
  border-radius:3px;
  background:var(--bg);
  overflow:hidden;
}
.budget-fill{
  height:100%;
  border-radius:3px;
  transition:width 0.6s ease;
}
.budget-fill.safe{background:var(--green)}
.budget-fill.warn{background:var(--yellow)}
.budget-fill.over{background:var(--red)}

/* ============================================================
   TOAST
   ============================================================ */
.toast{
  position:fixed;
  bottom:90px;
  left:50%;
  transform:translateX(-50%);
  background:var(--text);
  color:#fff;
  padding:12px 20px;
  border-radius:10px;
  font-size:13px;
  font-weight:500;
  z-index:200;
  animation:slideUp 0.3s;
  max-width:90%;
  box-shadow:0 8px 24px rgba(0,0,0,0.2);
}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}

/* ============================================================
   LOADING
   ============================================================ */
.loading{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,0.9);
  z-index:150;
  display:grid;
  place-items:center;
  backdrop-filter:blur(4px);
}
.spinner{
  width:40px;
  height:40px;
  border:3px solid var(--border);
  border-top-color:var(--bri-blue);
  border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============================================================
   UTILITIES
   ============================================================ */
.hidden{display:none !important}
.text-center{text-align:center}
.text-muted{color:var(--text-2)}
.mono{font-variant-numeric:tabular-nums}
.mt-3{margin-top:12px}
.mb-3{margin-bottom:12px}
.p-4{padding:16px}

/* Filter chips */
.chip-row{
  display:flex;
  gap:8px;
  padding:12px 16px;
  overflow-x:auto;
  scrollbar-width:none;
  background:var(--card);
  border-bottom:1px solid var(--border);
}
.chip-row::-webkit-scrollbar{display:none}
.chip{
  padding:6px 14px;
  border-radius:20px;
  background:var(--bg);
  border:1px solid var(--border);
  font-size:13px;
  font-weight:500;
  color:var(--text-2);
  cursor:pointer;
  white-space:nowrap;
  font-family:inherit;
  transition:all 0.2s;
}
.chip.active{
  background:var(--bri-blue);
  border-color:var(--bri-blue);
  color:#fff;
}

/* Search */
.search-wrap{
  padding:12px 16px;
  background:var(--card);
  border-bottom:1px solid var(--border);
}
.search-input{
  width:100%;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 14px;
  font-size:14px;
  outline:none;
}
.search-input:focus{border-color:var(--bri-blue)}

/* Chart wrap */
.chart-wrap{
  position:relative;
  height:220px;
  padding:16px;
}
</style>
</head>
<body>

<div class="app">

  <!-- ============ LOADING ============ -->
  <div id="loading" class="loading"><div class="spinner"></div></div>

  <!-- ============ PAGE: HOME ============ -->
  <div id="page-home" class="page active">
    <div class="header">
      <div class="header-top">
        <div class="header-brand">
          <div class="header-logo">B</div>
          <div class="header-title">BRImo Personal</div>
        </div>
        <div class="header-actions">
          <button class="header-icon-btn" onclick="toggleBalance()" title="Sembunyikan saldo">
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <button class="header-icon-btn" onclick="refreshData()" title="Refresh">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          </button>
        </div>
      </div>

      <div class="balance-label">
        Saldo Aktual
      </div>
      <div class="balance-amount" id="balanceAmount">Rp0</div>
      <div class="balance-sub" id="balanceSub">Arus kas bersih bulan ini: Rp0</div>
    </div>

    <!-- MENU GRID -->
    <div class="menu-card">
      <div class="menu-grid">
        <button class="menu-item" onclick="openTxForm('income')">
          <div class="menu-icon green">💰</div>
          <div class="menu-label">Pemasukan</div>
        </button>
        <button class="menu-item" onclick="openTxForm('expense')">
          <div class="menu-icon red">🛒</div>
          <div class="menu-label">Pengeluaran</div>
        </button>
        <button class="menu-item" onclick="openTxForm('saving')">
          <div class="menu-icon blue">🏦</div>
          <div class="menu-label">Tabungan</div>
        </button>
        <button class="menu-item" onclick="openTxForm('debt')">
          <div class="menu-icon yellow">📋</div>
          <div class="menu-label">Cicilan</div>
        </button>
      </div>
    </div>

    <!-- STATS -->
    <div class="stat-row">
      <div class="stat-box">
        <div class="stat-label">Pemasukan</div>
        <div class="stat-value income" id="statIncome">Rp0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Pengeluaran</div>
        <div class="stat-value expense" id="statExpense">Rp0</div>
      </div>
    </div>

    <!-- CHART -->
    <div class="section">
      <div class="section-head">
        <div class="section-title">Tren 6 Bulan</div>
      </div>
      <div class="card">
        <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
      </div>
    </div>

    <!-- TRANSAKSI TERBARU -->
    <div class="section">
      <div class="section-head">
        <div class="section-title">Transaksi Terbaru</div>
        <button class="section-link" onclick="switchPage('transaksi')">Lihat Semua</button>
      </div>
      <div id="recentTx"></div>
    </div>
  </div>

  <!-- ============ PAGE: TRANSAKSI ============ -->
  <div id="page-transaksi" class="page">
    <div class="page-header back">
      <button class="back-btn" onclick="switchPage('home')">

  <!-- ============ PAGE: LAPORAN ============ -->
  <div id="page-laporan" class="page">

      <div class="card mt-3 p-4" id="reportSummary"></div>

      <button class="btn btn-ghost btn-block mt-3" onclick="exportCSV()">
        📥 Export CSV
      </button>

  <!-- ============ BOTTOM NAV ============ -->
  <nav class="bottom-nav">

      <span>Beranda</span>
    </button>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-2 2 2 2-2 2 2 2-2 2 2 2-2 2 2V2l-2 2-2-2-2 2-2-2-2 2-2-2-2 2z"/></svg>

<div id="txModal" class="modal-bg hidden" onclick="if(event.target===this)closeTxForm()">

    <div class="segmented" id="txTypeSeg">

      <button type="button" class="seg-btn active" data-type="expense" onclick="setTxType('expense')">Keluar</button>
      <button type="button" class="seg-btn" data-type="saving" onclick="setTxType('saving')">Tabung</button>

      <label class="form-label">Kategori</label>

  <form class="modal" onsubmit="saveAccount(event)">
    <span class="modal-handle"></span>

      <label class="form-label">Nama Akun</label>

      <label class="form-label">Tipe</label>
      <select class="form-input" id="accType">
        <option value="bank">Bank</option>
        <option value="cash">Tunai</option>
        <option value="ewallet">E-Wallet</option>
        <option value="credit">Kartu Kredit</option>
      </select>

      <label class="form-label">Saldo Awal</label>

<script>
/* ============================================================
   KONFIGURASI SUPABASE — GANTI DENGAN MILIK ANDA
   ============================================================ */
const SUPABASE_URL = 'ISI_URL_DISINI';
const SUPABASE_KEY = 'ISI_ANON_KEY_DISINI';

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ============================================================
   STATE
   ============================================================ */
let state = {
  accounts: [],
  categories: [],
  transactions: [],
  budgets: [],
  currentPage: 'home',
  filterType: '',
  balanceHidden: false,
};

/* ============================================================
   HELPERS
   ============================================================ */
const rupiah = n => new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n||0);
const rupiahShort = n => {
  n = n||0;
  const abs = Math.abs(n);
  if(abs >= 1e9) return 'Rp' + (n/1e9).toFixed(1) + 'M';
  if(abs >= 1e6) return 'Rp' + (n/1e6).toFixed(1) + 'jt';
  if(abs >= 1e3) return 'Rp' + (n/1e3).toFixed(0) + 'rb';
  return 'Rp' + n;
};
const monthKey = (d=new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
const monthLabel = ym => {
  const [y,m] = ym.split('-').map(Number);
  return new Date(y,m-1,1).toLocaleDateString('id-ID',{month:'short',year:'2-digit'});
};
const dateLabel = iso => new Date(iso).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
const esc = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function showToast(msg, type='success'){
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300)}, 2500);
}

function showLoading(show){
  document.getElementById('loading').classList.toggle('hidden', !show);
}

/* ============================================================
   DATA LOADING
   ============================================================ */
async function loadAllData(){
  const [acc, cat, tx, bgt] = await Promise.all([
    db.from('accounts').select('*').order('created_at'),
    db.from('categories').select('*').order('created_at'),
    db.from('transactions').select('*').order('date', {ascending:false}),
    db.from('budgets').select('*'),
  ]);
  state.accounts = acc.data || [];
  state.categories = cat.data || [];
  state.transactions = tx.data || [];
  state.budgets = bgt.data || [];
}

async function refreshData(){
  showLoading(true);
  try{
    await loadAllData();
    renderAll();
    showToast('Data diperbarui');
  }catch(e){
    console.error(e);
    showToast('Gagal memuat data', 'error');
  }finally{
    showLoading(false);
  }
}

/* ============================================================
   RENDER
   ============================================================ */
function renderAll(){
  renderHome();
  renderTxList();
  renderBudgetDisplay();
  renderAccountList();
}

function renderHome(){
  const mk = monthKey();
  const txs = state.transactions.filter(t => t.date.startsWith(mk));
  const income = txs.filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount),0);
  const expense = txs.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0);
  const saving = txs.filter(t=>t.type==='saving').reduce((s,t)=>s+Number(t.amount),0);
  const debt = txs.filter(t=>t.type==='debt').reduce((s,t)=>s+Number(t.amount),0);
  const net = income - expense - saving - debt;

  // Total saldo dari semua akun + net transaksi
  const totalBalance = state.accounts.reduce((s,a)=>s+Number(a.balance||0),0) + net;

  document.getElementById('balanceAmount').textContent = state.balanceHidden ? '••••••••' : rupiah(totalBalance);
  document.getElementById('balanceSub').textContent = `Arus kas bersih bulan ini: ${state.balanceHidden?'•••••':rupiah(net)}`;
  document.getElementById('statIncome').textContent = state.balanceHidden ? '•••••' : rupiahShort(income);
  document.getElementById('statExpense').textContent = state.balanceHidden ? '•••••' : rupiahShort(expense);

  // Recent tx
  const recent = state.transactions.slice(0,5);
  const el = document.getElementById('recentTx');
  if(!recent.length){
    el.innerHTML = `<div class="card">
      <div class="empty">
        <div class="empty-icon">📭</div>
        <div class="empty-title">Belum ada transaksi</div>
        <div class="empty-desc">Mulai catat transaksi pertama Anda</div>
      </div>
    </div>`;
  } else {
    el.innerHTML = `<div class="tx-list">${recent.map(txRowHTML).join('')}</div>`;
  }

  renderChart();
}

function txRowHTML(t){
  const cat = state.categories.find(c=>c.id===t.category_id);
  const catName = cat ? cat.name : 'Tanpa Kategori';
  const catIcon = cat ? (cat.icon || '📦') : '📦';
  const acc = state.accounts.find(a=>a.id===t.account_id);
  const accName = acc ? acc.name : '—';
  const sign = t.type === 'income' ? '+' : '-';

  return `<div class="tx-item">
    <div class="tx-icon ${t.type}">${catIcon}</div>
    <div class="tx-info">
      <div class="tx-cat">${esc(catName)}</div>
      <div class="tx-note">${esc(t.note || accName)}</div>
    </div>
    <div>
      <div class="tx-amount ${t.type}">${sign}${rupiah(t.amount)}</div>
      <div class="tx-date">${dateLabel(t.date)}</div>
    </div>
  </div>`;
}

let trendChartInstance = null;
function renderChart(){
  const labels = [], incomes = [], expenses = [];
  const now = new Date();
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(),now.getMonth()-i,1);
    const mk = monthKey(d);
    labels.push(monthLabel(mk));
    const mTx = state.transactions.filter(t=>t.date.startsWith(mk));
    incomes.push(mTx.filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount),0));
    expenses.push(mTx.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0));
  }

  const ctx = document.getElementById('trendChart').getContext('2d');
  if(trendChartInstance) trendChartInstance.destroy();
  trendChartInstance = new Chart(ctx,{
    type:'bar',
    data:{
      labels,
      datasets:[
        {label:'Masuk', data:incomes, backgroundColor:'#10B981', borderRadius:4, barPercentage:0.6},
        {label:'Keluar', data:expenses, backgroundColor:'#EF4444', borderRadius:4, barPercentage:0.6},
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{position:'top',align:'end',labels:{font:{family:'Inter',size:11},boxWidth:10,boxHeight:10,usePointStyle:true,padding:12}},
        tooltip:{
          backgroundColor:'#1A1A1A',
          padding:10,
          cornerRadius:8,
          titleFont:{family:'Inter',size:12},
          bodyFont:{family:'Inter',size:12},
          callbacks:{label:ctx=>` ${ctx.dataset.label}: ${rupiah(ctx.parsed.y)}`}
        }
      },
      scales:{
        x:{grid:{display:false},ticks:{color:'#9CA3AF',font:{family:'Inter',size:11}}},
        y:{grid:{color:'#F3F4F6'},border:{display:false},ticks:{color:'#9CA3AF',font:{family:'Inter',size:11},callback:v=>v>=1000?(v/1000)+'k':v}}
      }
    }
  });
}

/* ============================================================
   NAVIGATION
   ============================================================ */
function switchPage(page){
  state.currentPage = page;
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.classList.toggle('active', el.dataset.page === page);
  });
  window.scrollTo({top:0,behavior:'smooth'});
  if(page==='laporan'){
    const rm = document.getElementById('reportMonth');
    if(!rm.value) rm.value = monthKey();
    renderReport();
  }
}

function toggleBalance(){
  state.balanceHidden = !state.balanceHidden;
  document.getElementById('eyeIcon').innerHTML = state.balanceHidden
    ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
    : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  renderHome();
}

/* ============================================================
   TRANSACTIONS
   ============================================================ */
let currentTxType = 'expense';

function openTxForm(type){
  if(type) currentTxType = type;
  document.getElementById('txModal').classList.remove('hidden');
  setTxType(currentTxType);
  document.getElementById('txAmount').value = '';
  document.getElementById('txDate').value = new Date().toISOString().slice(0,10);
  document.getElementById('txNote').value = '';
  updateTxCategories();
  updateTxAccounts();
  setTimeout(()=>document.getElementById('txAmount').focus(),150);
}

function closeTxForm(){ document.getElementById('txModal').classList.add('hidden'); }

function setTxType(type){
  currentTxType = type;
  document.querySelectorAll('#txTypeSeg .seg-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.type===type);
  });
  updateTxCategories();
}

function updateTxCategories(){
  const sel = document.getElementById('txCategory');
  const cats = state.categories.filter(c=>c.type===currentTxType);
  sel.innerHTML = cats.length
    ? cats.map(c=>`<option value="${c.id}">${c.icon||'📦'} ${esc(c.name)}</option>`).join('')
    : '<option value="">— Tidak ada kategori —</option>';
}

function updateTxAccounts(){
  const sel = document.getElementById('txAccount');
  sel.innerHTML = state.accounts.length
    ? state.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')
    : '<option value="">— Tidak ada akun —</option>';
}

async function saveTx(e){
  e.preventDefault();
  const amount = Number(document.getElementById('txAmount').value);
  if(!amount || amount <= 0){ showToast('Nominal harus lebih dari 0','error'); return; }

  const payload = {
    type: currentTxType,
    amount,
    category_id: document.getElementById('txCategory').value || null,
    account_id: document.getElementById('txAccount').value || null,
    date: document.getElementById('txDate').value,
    note: document.getElementById('txNote').value.trim() || null,
  };

  showLoading(true);
  const {error} = await db.from('transactions').insert(payload);
  showLoading(false);

  if(error){ showToast('Gagal menyimpan: ' + error.message, 'error'); return; }
  closeTxForm();
  showToast('Transaksi tersimpan');
  await loadAllData();
  renderAll();
}

async function deleteTx(id){
  if(!confirm('Hapus transaksi ini?')) return;
  showLoading(true);
  await db.from('transactions').delete().eq('id', id);
  showLoading(false);
  showToast('Transaksi dihapus');
  await loadAllData();
  renderAll();
}

function setFilter(type, el){
  state.filterType = type;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  renderTxList();
}

function renderTxList(){
  const search = (document.getElementById('txSearch')?.value || '').toLowerCase();
  let txs = state.transactions.slice();
  if(state.filterType) txs = txs.filter(t=>t.type===state.filterType);
  if(search) txs = txs.filter(t => (t.note||'').toLowerCase().includes(search));

  const el = document.getElementById('txList');
  if(!txs.length){
    el.innerHTML = `<div class="card"><div class="empty">
      <div class="empty-icon">🔍</div>
      <div class="empty-title">Tidak ada transaksi</div>
      <div class="empty-desc">${search?'Coba kata kunci lain':'Belum ada transaksi di kategori ini'}</div>
    </div></div>`;
    return;
  }

  // Group by date
  const groups = {};
  txs.forEach(t=>{
    if(!groups[t.date]) groups[t.date] = [];
    groups[t.date].push(t);
  });

  el.innerHTML = Object.entries(groups).map(([date, items])=>{
    return `<div style="margin-bottom:16px">
      <div style="font-size:12px;font-weight:600;color:var(--text-3);margin-bottom:8px;padding:0 4px">${dateLabel(date)}</div>
      <div class="tx-list">${items.map(t=>`
        <div class="tx-item" onclick="deleteTx('${t.id}')">
          ${txRowInner(t)}
        </div>
      `).join('')}</div>
    </div>`;
  }).join('');
}

function txRowInner(t){
  const cat = state.categories.find(c=>c.id===t.category_id);
  const catName = cat ? cat.name : 'Tanpa Kategori';
  const catIcon = cat ? (cat.icon || '📦') : '📦';
  const sign = t.type === 'income' ? '+' : '-';
  return `
    <div class="tx-icon ${t.type}">${catIcon}</div>
    <div class="tx-info">
      <div class="tx-cat">${esc(catName)}</div>
      <div class="tx-note">${esc(t.note || '—')}</div>
    </div>
    <div class="tx-amount ${t.type}">${sign}${rupiah(t.amount)}</div>
  `;
}

/* ============================================================
   BUDGET
   ============================================================ */
function renderBudgetDisplay(){
  const mk = monthKey();
  const budgets = state.budgets.filter(b=>b.month===mk);
  const txs = state.transactions.filter(t=>t.date.startsWith(mk) && t.type==='expense');

  const el = document.getElementById('budgetDisplay');
  if(!budgets.length){
    el.innerHTML = `<div class="empty">
      <div class="empty-icon">📊</div>
      <div class="empty-title">Belum ada anggaran</div>
      <div class="empty-desc">Anggaran belum diatur untuk bulan ini</div>
    </div>`;
    return;
  }

  el.innerHTML = budgets.map(b=>{
    const cat = state.categories.find(c=>c.id===b.category_id);
    if(!cat) return '';
    const actual = txs.filter(t=>t.category_id===b.category_id).reduce((s,t)=>s+Number(t.amount),0);
    const pct = b.amount > 0 ? Math.min((actual/Number(b.amount))*100, 100) : 0;
    const realPct = b.amount > 0 ? (actual/Number(b.amount))*100 : 0;
    const cls = realPct >= 100 ? 'over' : realPct >= 80 ? 'warn' : 'safe';
    return `<div class="budget-item">
      <div class="budget-head">
        <span class="budget-name">${cat.icon||'📦'} ${esc(cat.name)}</span>
        <span class="budget-nums">${rupiah(actual)} / ${rupiah(b.amount)}</span>
      </div>
      <div class="budget-bar"><div class="budget-fill ${cls}" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
}

/* ============================================================
   ACCOUNT
   ============================================================ */
function openAccountForm(){
  document.getElementById('accountModal').classList.remove('hidden');
  document.getElementById('accName').value = '';
  document.getElementById('accType').value = 'bank';
  document.getElementById('accBalance').value = '0';
}
function closeAccountForm(){ document.getElementById('accountModal').classList.add('hidden'); }

async function saveAccount(e){
  e.preventDefault();
  const name = document.getElementById('accName').value.trim();
  if(!name) return;

  showLoading(true);
  const {error} = await db.from('accounts').insert({
    name,
    type: document.getElementById('accType').value,
    balance: Number(document.getElementById('accBalance').value) || 0,
  });
  showLoading(false);

  if(error){ showToast('Gagal: '+error.message,'error'); return; }
  closeAccountForm();
  showToast('Akun ditambahkan');
  await loadAllData();
  renderAll();
}

async function deleteAccount(id){
  if(!confirm('Hapus akun ini?')) return;
  showLoading(true);
  await db.from('accounts').delete().eq('id', id);
  showLoading(false);
  showToast('Akun dihapus');
  await loadAllData();
  renderAll();
}

function renderAccountList(){
  const typeLabel = {cash:'Tunai',bank:'Bank',ewallet:'E-Wallet',credit:'Kartu Kredit'};
  const el = document.getElementById('accountList');
  if(!state.accounts.length){
    el.innerHTML = `<div class="empty">
      <div class="empty-icon">💳</div>
      <div class="empty-title">Belum ada akun</div>
      <div class="empty-desc">Tambahkan akun pertama Anda</div>
    </div>`;
    return;
  }
  el.innerHTML = state.accounts.map(a=>`
    <div class="tx-item">
      <div class="tx-icon saving">💳</div>
      <div class="tx-info">
        <div class="tx-cat">${esc(a.name)}</div>
        <div class="tx-note">${typeLabel[a.type]||a.type}</div>
      </div>
      <div class="tx-amount" style="color:var(--text)">${rupiah(a.balance)}</div>
    </div>
  `).join('');
}

/* ============================================================
   REPORT
   ============================================================ */
function renderReport(){
  const mk = document.getElementById('reportMonth').value || monthKey();
  const txs = state.transactions.filter(t=>t.date.startsWith(mk));
  const income = txs.filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount),0);
  const expense = txs.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0);
  const saving = txs.filter(t=>t.type==='saving').reduce((s,t)=>s+Number(t.amount),0);
  const debt = txs.filter(t=>t.type==='debt').reduce((s,t)=>s+Number(t.amount),0);
  const net = income - expense - saving - debt;

  document.getElementById('reportSummary').innerHTML = `
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
        <span style="color:var(--text-2)">Pemasukan</span>
        <span class="mono" style="color:var(--green);font-weight:700">${rupiah(income)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
        <span style="color:var(--text-2)">Pengeluaran</span>
        <span class="mono" style="color:var(--red);font-weight:700">${rupiah(expense)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
        <span style="color:var(--text-2)">Tabungan</span>
        <span class="mono" style="color:var(--bri-blue);font-weight:700">${rupiah(saving)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
        <span style="color:var(--text-2)">Cicilan</span>
        <span class="mono" style="color:var(--yellow);font-weight:700">${rupiah(debt)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:12px 0;font-size:16px">
        <span style="font-weight:700">Arus Kas Bersih</span>
        <span class="mono" style="font-weight:800;color:${net>=0?'var(--green)':'var(--red)'}">${rupiah(net)}</span>
      </div>
    </div>
  `;
}

function exportCSV(){
  const mk = document.getElementById('reportMonth').value || monthKey();
  const txs = state.transactions.filter(t=>t.date.startsWith(mk));
  if(!txs.length){ showToast('Tidak ada data','error'); return; }
  const rows = [['Tanggal','Tipe','Kategori','Akun','Keterangan','Nominal']];
  txs.forEach(t=>{
    rows.push([
      t.date, t.type,
      state.categories.find(c=>c.id===t.category_id)?.name||'',
      state.accounts.find(a=>a.id===t.account_id)?.name||'',
      (t.note||'').replace(/,/g,';'),
      t.amount
    ]);
  });
  const csv = rows.map(r=>r.join(',')).join('\n');
  const blob = new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `laporan-${mk}.csv`;
  a.click();
  showToast('CSV diunduh');
}

/* ============================================================
   INIT
   ============================================================ */
async function init(){
  showLoading(true);
  try{
    await loadAllData();
    renderAll();
  }catch(e){
    console.error(e);
    showToast('Gagal terhubung ke database. Cek konfigurasi Supabase.','error');
  }finally{
    showLoading(false);
  }
}

init();

document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeTxForm(), closeAccountForm();
});
</script>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#00529C" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>BRImo Personal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* ============ RESET & TOKENS ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bri:#00529C;--bri-d:#003A70;--bri-l:#1B6CB8;
  --orange:#F37021;--orange-s:#FFF4EC;
  --bg:#F5F7FA;--card:#FFF;--text:#1A1A1A;--text-2:#6B7280;--text-3:#9CA3AF;
  --border:#E5E7EB;--green:#10B981;--red:#EF4444;--yellow:#F59E0B;--violet:#8B5CF6;
  --r:12px;--r-lg:16px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.08);
  --shadow-lg:0 10px 30px rgba(0,0,0,.12);
}
html.dark{
  --bg:#0F172A;--card:#1E293B;--text:#F1F5F9;--text-2:#94A3B8;--text-3:#64748B;
  --border:#334155;--orange-s:rgba(243,112,33,.15);
  --shadow:0 1px 3px rgba(0,0,0,.3);--shadow-md:0 4px 12px rgba(0,0,0,.4);--shadow-lg:0 10px 30px rgba(0,0,0,.5);
}
html,body{height:100%}
body{
  font-family:'Inter',-apple-system,system-ui,sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
  transition:background .3s,color .3s;
}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px !important}

/* ============ APP SHELL ============ */
.app{
  max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;
  background:var(--bg);position:relative;padding-bottom:80px;
  box-shadow:0 0 40px rgba(0,0,0,.05);
}
@media(min-width:768px){
  body{background:#E8ECF2;padding:20px 0}
  .app{border-radius:24px;min-height:calc(100vh - 40px);overflow:hidden;box-shadow:var(--shadow-lg)}
  html.dark body{background:#0A0E1A}
}

/* ============ PIN SCREEN ============ */
.pin-screen{
  position:fixed;inset:0;z-index:300;background:linear-gradient(135deg,var(--bri) 0%,var(--bri-d) 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;
  color:#fff;
}
.pin-logo{
  width:64px;height:64px;border-radius:16px;background:var(--orange);
  display:grid;place-items:center;font-weight:800;font-size:28px;margin-bottom:24px;
  box-shadow:0 8px 24px rgba(243,112,33,.4);
}
.pin-title{font-size:20px;font-weight:700;margin-bottom:8px}
.pin-desc{font-size:13px;opacity:.8;margin-bottom:32px;text-align:center;max-width:280px;line-height:1.6}
.pin-dots{display:flex;gap:16px;margin-bottom:32px}
.pin-dot{
  width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.5);
  transition:all .2s;
}
.pin-dot.filled{background:#fff;border-color:#fff;transform:scale(1.15)}
.pin-dot.error{border-color:#FCA5A5;background:#FCA5A5}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:280px}
.pin-key{
  height:64px;border-radius:16px;background:rgba(255,255,255,.15);
  border:none;color:#fff;font-size:22px;font-weight:600;font-family:inherit;
  transition:all .15s;
}
.pin-key:hover{background:rgba(255,255,255,.25)}
.pin-key:active{transform:scale(.95);background:rgba(255,255,255,.35)}
.pin-key.clear{font-size:14px}
.pin-setup-hint{font-size:12px;opacity:.7;margin-top:16px;text-align:center}

/* ============ HEADER ============ */
.header{
  background:linear-gradient(135deg,var(--bri) 0%,var(--bri-d) 100%);
  color:#fff;padding:calc(20px + env(safe-area-inset-top)) 20px 24px;
  border-radius:0 0 24px 24px;margin-bottom:-20px;z-index:1;position:relative;overflow:hidden;
}
.header::before{
  content:'';position:absolute;top:-50%;right:-30%;width:200%;height:200%;
  background:radial-gradient(circle,rgba(255,255,255,.08) 0%,transparent 70%);
  pointer-events:none;
}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;position:relative}
.header-brand{display:flex;align-items:center;gap:10px}
.header-logo{
  width:36px;height:36px;background:var(--orange);border-radius:10px;
  display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;
}
.header-title{font-size:15px;font-weight:700}
.header-greeting{font-size:11px;opacity:.75;margin-top:1px}
.header-actions{display:flex;gap:8px}
.header-icon-btn{
  width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.15);
  border:none;color:#fff;display:grid;place-items:center;transition:background .2s;
}
.header-icon-btn:hover{background:rgba(255,255,255,.25)}
.header-icon-btn:active{transform:scale(.95)}

.balance-label{font-size:12px;opacity:.85;margin-bottom:6px;position:relative}
.balance-amount{
  font-size:30px;font-weight:800;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;margin-bottom:4px;position:relative;min-height:38px;
}
.balance-sub{font-size:12px;opacity:.75;position:relative}
.dots-loading span{display:inline-block;animation:dotPulse 1.4s infinite}
.dots-loading span:nth-child(2){animation-delay:.2s}
.dots-loading span:nth-child(3){animation-delay:.4s}
@keyframes dotPulse{0%,80%,100%{opacity:.3}40%{opacity:1}}

/* ============ MENU CARD ============ */
.menu-card{
  background:var(--card);margin:20px 16px 0;padding:18px 12px;
  border-radius:var(--r-lg);box-shadow:var(--shadow);position:relative;z-index:2;
}
.menu-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.menu-item{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  background:none;border:none;padding:10px 4px;border-radius:12px;transition:background .2s;
}
.menu-item:hover{background:var(--bg)}
.menu-item:active{transform:scale(.95)}
.menu-icon{
  width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:22px;
  transition:transform .2s;
}
.menu-item:hover .menu-icon{transform:scale(1.05)}
.menu-icon.green{background:#E7F8F1}
.menu-icon.red{background:#FEE9E9}
.menu-icon.blue{background:#E6F0FA}
.menu-icon.yellow{background:#FFF7E6}
html.dark .menu-icon.green{background:rgba(16,185,129,.15)}
html.dark .menu-icon.red{background:rgba(239,68,68,.15)}
html.dark .menu-icon.blue{background:rgba(0,82,156,.25)}
html.dark .menu-icon.yellow{background:rgba(245,158,11,.15)}
.menu-label{font-size:11px;font-weight:500;color:var(--text);text-align:center;line-height:1.2}

/* ============ SECTION ============ */
.section{margin:20px 16px 0}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-title{font-size:15px;font-weight:700}
.section-link{
  font-size:13px;color:var(--bri);font-weight:600;
  background:none;border:none;padding:4px 0;
}
html.dark .section-link{color:#60A5FA}

/* ============ TX LIST ============ */
.tx-group{margin-bottom:16px}
.tx-group-head{
  display:flex;justify-content:space-between;padding:0 4px 8px;
  font-size:12px;color:var(--text-3);font-weight:600;
}
.tx-group-total{font-variant-numeric:tabular-nums}
.tx-list{background:var(--card);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.tx-item{
  display:flex;align-items:center;gap:12px;padding:14px 16px;
  border-bottom:1px solid var(--border);transition:background .15s;position:relative;
}
.tx-item:last-child{border-bottom:none}
.tx-item:active{background:var(--bg)}
.tx-icon{
  width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
  font-size:20px;flex-shrink:0;
}
.tx-icon.income{background:#E7F8F1}
.tx-icon.expense{background:#FEE9E9}
.tx-icon.saving{background:#E6F0FA}
.tx-icon.debt{background:#FFF7E6}
html.dark .tx-icon.income{background:rgba(16,185,129,.15)}
html.dark .tx-icon.expense{background:rgba(239,68,68,.15)}
html.dark .tx-icon.saving{background:rgba(0,82,156,.25)}
html.dark .tx-icon.debt{background:rgba(245,158,11,.15)}
.tx-info{flex:1;min-width:0}
.tx-cat{
  font-size:14px;font-weight:600;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tx-note{
  font-size:12px;color:var(--text-3);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;margin-top:2px;
}
.tx-amount{
  font-size:14px;font-weight:700;text-align:right;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.tx-amount.income{color:var(--green)}
.tx-amount.expense{color:var(--red)}
.tx-amount.saving{color:var(--bri)}
.tx-amount.debt{color:var(--yellow)}
html.dark .tx-amount.saving{color:#60A5FA}
.tx-date{font-size:11px;color:var(--text-3);text-align:right;margin-top:2px;font-variant-numeric:tabular-nums}
.tx-menu{
  background:none;border:none;color:var(--text-3);padding:6px;border-radius:8px;
  display:grid;place-items:center;
}
.tx-menu:hover{background:var(--bg);color:var(--text)}

/* ============ BOTTOM NAV ============ */
.bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--border);
  display:flex;justify-content:space-around;
  padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:40;
  box-shadow:0 -2px 12px rgba(0,0,0,.04);
}
@media(min-width:768px){
  .bottom-nav{border-radius:0 0 24px 24px;position:absolute;bottom:0}
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;padding:6px 12px;border-radius:8px;
  color:var(--text-3);font-size:10px;font-weight:500;
  transition:color .2s;flex:1;max-width:80px;
}
.nav-item.active{color:var(--bri)}
html.dark .nav-item.active{color:#60A5FA}
.nav-item svg{width:22px;height:22px}

/* ============ PAGES ============ */
.page{display:none}
.page.active{display:block;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.page-header{
  background:linear-gradient(135deg,var(--bri) 0%,var(--bri-d) 100%);
  color:#fff;padding:calc(16px + env(safe-area-inset-top)) 20px 16px;
  display:flex;align-items:center;gap:14px;
}
.back-btn{
  width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.15);
  border:none;color:#fff;display:grid;place-items:center;flex-shrink:0;
}
.back-btn:hover{background:rgba(255,255,255,.25)}
.back-btn:active{transform:scale(.95)}
.page-title-bar{font-size:16px;font-weight:700}
.page-subtitle{font-size:11px;opacity:.75;margin-top:1px}

/* ============ CARD ============ */
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}

/* Stat */
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px}
.stat-box{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.stat-label{font-size:11px;color:var(--text-2);font-weight:500;margin-bottom:4px}
.stat-value{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.stat-value.income{color:var(--green)}
.stat-value.expense{color:var(--red)}
.stat-value.saving{color:var(--bri)}
html.dark .stat-value.saving{color:#60A5FA}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;
  border:none;transition:all .15s;white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--bri);color:#fff}
.btn-primary:hover{background:var(--bri-d)}
.btn-orange{background:var(--orange);color:#fff}
.btn-orange:hover{filter:brightness(.95)}
.btn-ghost{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--border)}
.btn-danger{background:#FEE9E9;color:var(--red)}
html.dark .btn-danger{background:rgba(239,68,68,.15)}
.btn-danger:hover{background:#FECACA}
html.dark .btn-danger:hover{background:rgba(239,68,68,.25)}
.btn-block{width:100%}
.btn-sm{padding:8px 14px;font-size:13px}
.btn[disabled]{opacity:.6;cursor:not-allowed}

/* ============ FORMS ============ */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.form-input{
  width:100%;background:var(--bg);border:1px solid var(--border);
  color:var(--text);padding:12px 14px;border-radius:10px;outline:none;
  transition:border-color .2s,background .2s;
}
.form-input:focus{border-color:var(--bri);background:var(--card)}
.form-input::placeholder{color:var(--text-3)}
.form-error{color:var(--red);font-size:12px;margin-top:4px}

/* Segmented */
.segmented{display:flex;background:var(--bg);border-radius:10px;padding:4px;gap:4px;margin-bottom:16px}
.seg-btn{
  flex:1;padding:10px 6px;border:none;background:none;color:var(--text-2);
  border-radius:8px;font-size:12px;font-weight:600;transition:all .2s;
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.seg-btn .seg-emoji{font-size:16px}
.seg-btn.active{background:var(--bri);color:#fff;box-shadow:0 2px 6px rgba(0,82,156,.3)}
.seg-btn[data-type="income"].active{background:var(--green);box-shadow:0 2px 6px rgba(16,185,129,.3)}
.seg-btn[data-type="expense"].active{background:var(--red);box-shadow:0 2px 6px rgba(239,68,68,.3)}
.seg-btn[data-type="saving"].active{background:var(--bri);box-shadow:0 2px 6px rgba(0,82,156,.3)}
.seg-btn[data-type="debt"].active{background:var(--yellow);box-shadow:0 2px 6px rgba(245,158,11,.3)}

/* Quick amount */
.quick-amount{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.quick-btn{
  padding:8px;border-radius:8px;border:1px solid var(--border);
  background:var(--card);color:var(--text-2);font-size:12px;font-weight:600;
  transition:all .15s;
}
.quick-btn:hover{border-color:var(--bri);color:var(--bri)}
.quick-btn:active{transform:scale(.95)}

/* ============ MODAL ============ */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;
  display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s;
  overflow-y:auto;padding-top:20px;
}
@media(min-width:768px){.modal-bg{align-items:center;padding:20px}}
.modal{
  background:var(--card);width:100%;max-width:480px;
  border-radius:20px 20px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));
  animation:slideUp .3s cubic-bezier(.
